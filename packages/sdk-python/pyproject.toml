[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astracipher"
version = "0.1.0"
description = "Python SDK for AstraCipher — Cryptographic Identity & Trust for AI Agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Santosh", email = "san.techie21@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "ai-agents",
    "identity",
    "did",
    "verifiable-credentials",
    "post-quantum",
    "cryptography",
    "trust",
    "mcp",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://astracipher.com"
Documentation = "https://astracipher.com/docs/python-sdk"
Repository = "https://github.com/AstraFintechLabs/astracipher"
Issues = "https://github.com/AstraFintechLabs/astracipher/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
