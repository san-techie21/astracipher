version: '3.8'

services:
  # AgentPass Verification Server
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "3456:3456"
    environment:
      - NODE_ENV=production
      - PORT=3456
      - NETWORK=testnet
      - DATABASE_URL=postgresql://agentpass:agentpass@postgres:5432/agentpass
      - CORS_ORIGIN=http://localhost:3000
      - RATE_LIMIT=200
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Dashboard (React frontend)
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3456
    depends_on:
      - server

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=agentpass
      - POSTGRES_USER=agentpass
      - POSTGRES_PASSWORD=agentpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
